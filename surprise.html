<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Surprise ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
</head>
<body class="surprise-page">
    <!-- Custom Cursor -->
    <div class="custom-cursor" id="custom-cursor"></div>

    <!-- Page Loader -->
    <div class="page-loader" id="page-loader">
        <div class="loader-circle"></div>
    </div>

    <!-- Background Effects -->
    <div class="particles-container" id="particles-container"></div>

    <div class="container">
        <div class="surprise-content reveal-up delay-100" style="text-align: center;">
            <h1 class="surprise-title gradient-text">You Make Life Beautiful</h1>
            
            <!-- Photo Frame with Cinematic Petals -->
            <div class="photo-frame reveal-up delay-300" style="position: relative; overflow: hidden;">
                <div id="petals-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;"></div>
                <img src="assets/images/bestfriend.jpg" alt="Best Friend" class="bestfriend-photo" onerror="this.src='https://images.unsplash.com/photo-1529156069898-49953eb1b5ce?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
            </div>

            <!-- Next Button -->
            <div class="reveal-up delay-400">
                <a href="poetry.html" class="cta-button">
                    Read Special Words 💌
                </a>
            </div>
        </div>
    </div>

    <!-- Floating Audio Player -->
    <div class="floating-audio" id="musicToggle">
        <svg id="musicIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>

    <script src="js/fireworks.js"></script>
    <script src="js/music.js"></script>
    <script src="js/script.js"></script>
    <script src="js/petals.js"></script>
</body>
</html>
