<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Poetry ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
</head>
<body class="poetry-page">
    <!-- Custom Cursor -->
    <div class="custom-cursor" id="custom-cursor"></div>

    <!-- Page Loader -->
    <div class="page-loader" id="page-loader">
        <div class="loader-circle"></div>
    </div>

    <!-- Background Effects -->
    <div class="particles-container" id="particles-container"></div>

    <div class="container">
        <div class="poetry-content reveal-up delay-100" style="text-align: center;">
            <h1 class="poetry-title gradient-text">For My Best Friend</h1>
            
            <!-- Friendship Shayari -->
            <div class="shayari-container glass-card reveal-up delay-200">
                <div class="shayari-text">
                    <div class="shayari-line reveal delay-100">"Dosti ka rishta sab rishton se pyara hota hai,</div>
                    <div class="shayari-line reveal delay-200">Har sukh dukh mein jo saath ho wahi humara hota hai…</div>
                    <div class="shayari-line reveal delay-300">Kabhi na tootne dena is khoobsurat rishte ko,</div>
                    <div class="shayari-line reveal delay-400">Kyun ke yeh dil ka sabse sachha sahara hota hai." 🤍</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Audio Player -->
    <div class="floating-audio" id="musicToggle">
        <svg id="musicIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>

    <script src="js/fireworks.js"></script>
    <script src="js/music.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
